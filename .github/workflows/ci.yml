name: ci
on:
  pull_request:
  # A new org gates pull_request-triggered runs (they queue with zero jobs), so
  # CI also runs on any pushed branch and can be dispatched by hand.
  push:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
  release-gate:
    if: github.event_name == 'pull_request'
    uses: brooswit-factory/release-gate/.github/workflows/gate.yml@v1
    with:
      gated-paths: '["^src/", "^schema/", "^package\\.json$"]'
      version-file: 'package.json'
