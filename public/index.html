<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>seer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>seer</h1>
      <span class="timestamp" id="snapshot-timestamp"></span>
      <button id="fit-button" type="button">Fit</button>
    </header>
    <aside id="node-list-sidebar">
      <div class="sidebar-header">
        <button id="animation-toggle" type="button" aria-pressed="true">Pulses: on</button>
      </div>
      <input type="text" id="node-filter" placeholder="Filter nodes…" aria-label="Filter nodes by key or label" autocomplete="off" />
      <ul id="node-list" role="listbox" aria-label="All nodes" tabindex="0"></ul>
    </aside>
    <div id="graph-wrap">
      <svg id="graph"></svg>
      <div id="tooltip"></div>
    </div>
    <aside id="sidebar">
      <div id="legend-view">
        <section id="shape-legend"></section>
        <section id="project-legend"></section>
        <section id="fill-legend"></section>
        <section id="border-legend"></section>
        <section id="size-legend"></section>
        <section id="queries"></section>
      </div>
      <div id="node-info-view" hidden>
        <div class="node-info-header">
          <h2>Selected node</h2>
          <button id="node-info-close" type="button" aria-label="Close and show legend">&times;</button>
        </div>
        <section id="node-info-content"></section>
      </div>
    </aside>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
